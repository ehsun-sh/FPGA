<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FPGA Lab | a Vivado-style learning environment</title>
    <meta name="description" content="Learn FPGA design step by step with Verilog and VHDL on a simulated 3D Digilent Nexys A7-100T board." />
    <meta name="theme-color" content="#f6eddd" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the saved theme before the first paint, so a dark page never flashes light (see src/ui/theme.ts)
      (function () {
        try {
          var t = localStorage.getItem('fpgalab:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#15171c' : '#f6eddd');
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FPGA Lab · learn FPGA design on a 3D Nexys A7" />
    <meta property="og:description" content="Step-by-step Verilog and VHDL lessons with a simulator, waveforms and a 3D Digilent Nexys A7-100T board, all in the browser." />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://learn.shahmohammadi.dev/fpga/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FPGA Lab: learn FPGA design in your browser, with a 3D Nexys A7 board" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
