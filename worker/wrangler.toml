# Worker that mounts the Pages site at learn.shahmohammadi.dev/fpga
# Deploy: cd worker && npx wrangler deploy
name = "fpga-learn-route"
main = "index.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "learn.shahmohammadi.dev/fpga*", zone_name = "shahmohammadi.dev" },
]

[vars]
PAGES_ORIGIN = "https://fpga-dkr.pages.dev"
