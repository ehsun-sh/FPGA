# One Worker serves the built site (dist/) at learn.shahmohammadi.dev/fpga.
# Cloudflare build settings: build `npm run build`, deploy `npx wrangler deploy`.
name = "fpga"
main = "worker/index.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "learn.shahmohammadi.dev/fpga*", zone_name = "shahmohammadi.dev" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
